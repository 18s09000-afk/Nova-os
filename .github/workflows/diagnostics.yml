name: Summarize Nova boot diagnostics
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnostics.yml]
  workflow_run:
    workflows: [Build Nova OS Live ISO]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build Nova OS Live ISO run ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  diagnostics:
    # Read artifacts only from this repository's trusted main build.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          run_id="$REQUESTED_RUN"
          if [ -z "$run_id" ]; then
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-iso.yml/runs?branch=main&status=completed&per_page=1" --jq '.workflow_runs[0].id')
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || exit 1
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: nova-os-0.1-amd64-*
          merge-multiple: true
          path: diagnostics
      - name: Show boot result and diagnostic log tails
        if: always()
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          root = Path('diagnostics')
          report = Path('.nova-diagnostics')
          report.mkdir(exist_ok=True)
          names = ['boot-result.json', 'qemu-stderr.log', 'qemu-serial.log', 'boot-catalog.txt', 'build.log']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# Nova OS build diagnostics\n\n')
              summary.write('Source run: ' + os.environ['SOURCE_RUN'] + '\n\n')
              summary.write('Download the ISO and full logs from the source run Artifacts.\n\n')
              for name in names:
                  path = root / name
                  summary.write('## ' + name + '\n\n')
                  if not path.is_file():
                      summary.write('Not produced. Check the source run steps.\n\n')
                      continue
                  # Bound output without loading large logs or executing their contents.
                  with path.open('rb') as stream:
                      stream.seek(max(0, path.stat().st_size - 22000))
                      text = stream.read().decode('utf-8', errors='replace')
                  text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
                  (report / name).write_text(text)
                  text = text.replace('```', "'''")
                  summary.write('```text\n' + text + '\n```\n\n')
          PY
      - name: Preserve bounded diagnostic reports on a separate branch
        if: success()
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
        run: |
          # Only generated text reports are committed; no ISO, credentials or application source.
          test -f .nova-diagnostics/boot-result.json
          branch="ci-diagnostics/run-${SOURCE_RUN}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'Nova OS CI'
          git config user.email 'nova-os-ci@users.noreply.github.com'
          git add -- .nova-diagnostics
          git commit -m "Record boot diagnostics for build $SOURCE_RUN"
          git push origin "HEAD:refs/heads/$branch"
